<!DOCTYPE html>
<html>
<head>
  <title>Unregister Service Worker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    button {
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    #status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h1>Service Worker Unregistration Tool</h1>
  <p>This page will help unregister any service workers that might be causing issues during development.</p>
  
  <button id="unregister">Unregister All Service Workers</button>
  <div id="status"></div>

  <script>
    document.getElementById('unregister').addEventListener('click', async () => {
      const statusDiv = document.getElementById('status');
      
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          
          if (registrations.length === 0) {
            statusDiv.className = 'success';
            statusDiv.textContent = 'No service workers found to unregister.';
            return;
          }
          
          for (let registration of registrations) {
            await registration.unregister();
          }
          
          statusDiv.className = 'success';
          statusDiv.textContent = `Successfully unregistered ${registrations.length} service worker(s). You can now close this page and reload your app.`;
          
          // Clear caches
          const cacheNames = await caches.keys();
          for (let cacheName of cacheNames) {
            await caches.delete(cacheName);
          }
          
          statusDiv.textContent += ` Also cleared ${cacheNames.length} cache(s).`;
        } catch (error) {
          statusDiv.className = 'error';
          statusDiv.textContent = `Error unregistering service workers: ${error.message}`;
        }
      } else {
        statusDiv.className = 'error';
        statusDiv.textContent = 'Service workers are not supported in this browser.';
      }
    });
  </script>
</body>
</html>
