<!DOCTYPE html>
<html>
<head>
    <title>FCM Token Debug</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a8b; }
        .output { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; white-space: pre-wrap; font-family: monospace; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>FCM Token Debug Tool</h1>
    
    <div class="section">
        <h3>1. Check Current FCM Tokens</h3>
        <button onclick="checkFCMTokens()">Check All FCM Tokens</button>
        <div id="tokensList" class="output"></div>
    </div>

    <div class="section">
        <h3>2. Register FCM Token for User ID</h3>
        <input type="text" id="userIdInput" placeholder="Enter User ID (e.g., 247)" value="247">
        <button onclick="registerForUser()">Register FCM Token</button>
        <div id="registerResult" class="output"></div>
    </div>

    <div class="section">
        <h3>3. Test Notification</h3>
        <input type="text" id="testUserIdInput" placeholder="User ID to send notification" value="247">
        <button onclick="testNotification()">Send Test Notification</button>
        <div id="notificationResult" class="output"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getMessaging, getToken } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAhH53y2wD18i2VBRrrBBPz4MiOIO30xO0",
            authDomain: "bigyox-pwa.firebaseapp.com",
            projectId: "bigyox-pwa",
            storageBucket: "bigyox-pwa.firebasestorage.app",
            messagingSenderId: "972017471932",
            appId: "1:972017471932:web:73a377145c0b6aa92f5bb9",
            measurementId: "G-T46CCYC0FC"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        window.checkFCMTokens = async function() {
            const output = document.getElementById('tokensList');
            output.textContent = 'Checking FCM tokens...';
            
            try {
                // First, let's try to call the debug function (if it exists)
                const response = await fetch('https://getcredentials-3757.twil.io/debugFCMTokens');
                if (response.ok) {
                    const data = await response.json();
                    output.textContent = JSON.stringify(data, null, 2);
                } else {
                    // If debug function doesn't exist, show basic info
                    output.textContent = `Debug function not available (${response.status})\n\nManual check needed:`;
                }
            } catch (error) {
                output.textContent = `Error: ${error.message}\n\nManual check needed.`;
            }
        };

        window.registerForUser = async function() {
            const userId = document.getElementById('userIdInput').value;
            const output = document.getElementById('registerResult');
            
            if (!userId) {
                output.textContent = 'Please enter a User ID';
                return;
            }

            output.textContent = 'Registering FCM token...';

            try {
                // Request permission
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    output.textContent = 'Notification permission denied';
                    return;
                }

                // Register service worker
                const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                
                // Get FCM token
                const token = await getToken(messaging, {
                    vapidKey: "BDy7JkFl_HOvmPKiESaJdyA-amCpJXyUbIk9uVr7eZqL2aXyKbr7zfe-z0-3Aq_Li1eBjcZ52w2CUGl7x2XTLeo",
                    serviceWorkerRegistration: registration,
                });

                output.textContent = `FCM Token for user ${userId}:\n${token}\n\nRegistering with Twilio...`;

                // Register with Twilio
                const response = await fetch('https://getcredentials-3757.twil.io/registerPushNotification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        fcmToken: token,
                        platform: 'fcm'
                    }),
                });

                const result = await response.json();
                output.textContent += `\n\nRegistration result:\n${JSON.stringify(result, null, 2)}`;

            } catch (error) {
                output.textContent = `Error: ${error.message}`;
            }
        };

        window.testNotification = async function() {
            const userId = document.getElementById('testUserIdInput').value;
            const output = document.getElementById('notificationResult');
            
            if (!userId) {
                output.textContent = 'Please enter a User ID';
                return;
            }

            output.textContent = 'Sending test notification...';

            try {
                const response = await fetch('https://getcredentials-3757.twil.io/sendCallNotification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        from: 'Debug Test',
                        callSid: 'test-' + Date.now(),
                        to: userId
                    }),
                });

                const result = await response.json();
                output.textContent = JSON.stringify(result, null, 2);

            } catch (error) {
                output.textContent = `Error: ${error.message}`;
            }
        };
    </script>
</body>
</html>
